<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consejería Académica | UNIMINUTO</title>
<style>
:root{--navy:#00225c;--blue:#006fc5;--yellow:#ffc000;--teal:#04878e;--bg:#f3f6fa;--ink:#1d2939;--muted:#667085;--line:#e4e9f0;--white:#fff;--green:#067647;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 "Segoe UI",Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}button{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:10px 14px;font-weight:650;cursor:pointer}button.alt{background:#eaf2fb;color:var(--navy)}button.light{background:transparent;color:var(--blue)}button.red{background:#fff0ef;color:var(--red)}button:disabled{opacity:.45;cursor:not-allowed}header{height:64px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{display:flex;gap:10px;align-items:center;font-weight:750}.mark{width:34px;height:34px;border-radius:9px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-weight:900}.wrap{display:flex;min-height:calc(100vh - 64px)}aside{width:230px;background:white;border-right:1px solid var(--line);padding:18px 12px;flex-shrink:0}.nav{display:block;width:100%;text-align:left;background:transparent;color:#344054;margin:3px 0}.nav.on{background:#eaf2fb;color:var(--navy)}.navgroup{font-size:10px;color:#98a2b3;font-weight:800;letter-spacing:1px;padding:14px 10px 5px}main{padding:26px;width:min(1300px,100%);margin:0 auto}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:20px}h1{font-size:25px;color:var(--navy);margin:0 0 5px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:15px 0}.stat,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:15px}.stat small{color:var(--muted);font-weight:650}.stat strong{display:block;font-size:27px;color:var(--navy);margin-top:6px}.panel h2{font-size:16px;color:var(--navy);margin:0 0 13px}.notice{padding:12px 14px;border-radius:9px;background:#fff8e6;border:1px solid #f1d58a;color:#705500;margin-bottom:15px}.info{padding:12px 14px;border-radius:9px;background:#edf6ff;border:1px solid #cfe4fb;color:#174a78;margin-bottom:15px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px}.toolbar input{flex:1;min-width:180px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:12px;font-weight:700;color:#536276}.field input,.field select{border:1px solid #d0d5dd;border-radius:8px;padding:10px 11px;background:#fff;min-width:0;width:100%}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 13px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{font-size:10px;text-transform:uppercase;color:#667085;background:#f8fafc;letter-spacing:.5px}td{font-size:13px}.tag{display:inline-block;padding:3px 8px;border-radius:20px;background:#eaf2fb;color:var(--navy);font-size:11px;font-weight:700}.tag.ok{background:#e8f7ef;color:var(--green)}.tag.full{background:#fff0ef;color:var(--red)}.empty{text-align:center;padding:28px;color:var(--muted)}.login{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:20px}.loginbox{background:#fff;width:min(440px,100%);padding:30px;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px #0b2b5010}.loginbox h1{font-size:23px}.loginbox .mark{margin-bottom:16px}.tabs{display:flex;gap:7px;margin:15px 0}.tabs button{flex:1}.tabs .selected{background:var(--navy)}.modal{position:fixed;inset:0;background:#061b3bb3;display:grid;place-items:center;padding:15px;z-index:9}.modalbox{background:white;width:min(650px,100%);max-height:90vh;overflow:auto;padding:22px;border-radius:14px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{margin:0;color:var(--navy)}.hidden{display:none!important}.slot{border:1px solid var(--line);border-radius:10px;padding:13px;margin:9px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.tiny{font-size:11px;color:var(--muted)}.right{display:flex;gap:8px;align-items:center}.footer{font-size:11px;color:#7b8797;margin-top:20px}.calendar-layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1fr);gap:22px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(30px,1fr));gap:5px}.calendar-grid button{padding:9px 2px;background:#fff;color:#344054;border:1px solid transparent;font-weight:500}.calendar-grid button.muted-day{color:#b4bdc9}.calendar-grid button.selected-day{background:var(--navy);color:#fff;border-radius:50%}.calendar-grid button.has-slots{border-color:#9bc7e8}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.time-grid{display:grid;grid-template-columns:repeat(3,minmax(80px,1fr));gap:10px}.time-option{background:#fff;color:var(--navy);border:1px solid #b9c2cc;padding:13px 8px;font-weight:500}.time-option:hover{border-color:var(--blue);background:#edf6ff}.sort-button{background:transparent;color:var(--navy);padding:2px 4px;font-size:10px}.subject-card{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff;cursor:pointer}.subject-card:hover{border-color:var(--blue);background:#f8fbff}.subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.checkcell{width:34px}.period-config{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.period-config .field{min-width:190px;flex:1}@media(max-width:700px){.calendar-layout{grid-template-columns:1fr}.time-grid{grid-template-columns:repeat(2,minmax(80px,1fr))}}
@media(max-width:800px){.wrap{display:block}aside{width:100%;display:flex;overflow:auto;padding:6px;border:0;border-bottom:1px solid var(--line)}.navgroup{display:none}.nav{white-space:nowrap;width:auto}.grid{grid-template-columns:repeat(2,1fr)}main{padding:16px}.head{display:block}.formgrid{grid-template-columns:1fr}}@media(max-width:460px){header{padding:0 12px}.grid{grid-template-columns:1fr 1fr}.hide-mobile{display:none}}
</style></head><body>
<header><div class="brand"><div class="mark">U</div><span>UNIMINUTO <span style="font-weight:400;opacity:.8">| Consejería Académica</span></span></div><div class="right"><span class="tiny" style="color:#dbeafe" id="who"></span><button class="alt" id="logout" onclick="logout()" style="display:none">Salir</button></div></header>
<div id="login" class="login"><div class="loginbox"><div class="mark">U</div><h1>Consejería Académica</h1><p class="muted">Ingresa para consultar y reservar tus espacios de acompañamiento.</p><div class="tabs"><button class="selected" id="studentTab" onclick="setLogin('student')">Estudiante</button><button class="alt" id="teacherTab" onclick="setLogin('teacher')">Docente</button><button class="alt" id="adminTab" onclick="setLogin('admin')">Administrativo</button></div><div id="loginFields"></div><p class="tiny" id="loginHelp"></p></div></div>
<div id="app" class="wrap hidden"><aside id="side"></aside><main id="main"></main></div>
<div class="modal hidden" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="mtitle"></h2><button class="alt" onclick="closeModal()">Cerrar</button></div><div id="mbody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const DBKEY='uniminuto_consejeria_v2',IDB_NAME='UNIMINUTO_Consejeria_DB',IDB_STORE='appdata',IDB_KEY='main';let db=blank(),loginRole='student',session=null,page='home',pendingCSV=null,idbReady=false,idbWritePending=false;
function blank(){return {students:[],teachers:[],availability:[],bookings:[],notifications:[],admin:null,officeEmail:'',audit:[],periodConfig:{},activePeriod:'2026-Q4'}}
function normalizeDB(d){d=d||blank();d.activePeriod=d.activePeriod||'2026-Q4';d.students=d.students||[];d.teachers=d.teachers||[];d.availability=d.availability||[];d.bookings=d.bookings||[];d.audit=d.audit||[];d.periodConfig=d.periodConfig||{};d.adminUsers=d.adminUsers||[];d.teacherChangeLog=d.teacherChangeLog||[];d.notifications=d.notifications||[];d.availability.forEach(a=>a.period=a.period||'2026-Q4');d.students.forEach(x=>(x.enrollments||[]).forEach(e=>e.period=e.period||x.period||'2026-Q4'));d.bookings.forEach(b=>{b.period=b.period||'2026-Q4';b.studentAttendance=b.studentAttendance||'Pendiente';b.teacherAttendance=b.teacherAttendance||'Pendiente'});ensurePasswords(d);return d}
function openIDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open(IDB_NAME,1);req.onupgradeneeded=()=>{let dbi=req.result;if(!dbi.objectStoreNames.contains(IDB_STORE))dbi.createObjectStore(IDB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function boot(){try{let idb=await openIDB(),tx=idb.transaction(IDB_STORE,'readonly'),req=tx.objectStore(IDB_STORE).get(IDB_KEY);req.onsuccess=()=>{let stored=req.result;if(stored)db=normalizeDB(stored);else{try{db=normalizeDB(JSON.parse(localStorage.getItem(DBKEY))||blank())}catch(e){db=normalizeDB(blank())}idbReady=true;persistToIDB();}idbReady=true;try{let savedSession=sessionStorage.getItem('uniminuto_session');if(savedSession){session=JSON.parse(savedSession);if(session&&session.role){page=session.role==='admin'?'dashboard':'home';showApp();return;}}}catch(e){}drawLogin();};req.onerror=()=>{alert('No se pudo leer la base IndexedDB del navegador.');db=normalizeDB(blank());idbReady=true;drawLogin();};}catch(e){console.error(e);alert('Este navegador no pudo inicializar IndexedDB. No importes datos hasta solucionar el problema.');drawLogin();}}
function persistToIDB(){if(!idbReady)return;try{let snapshot=structuredClone(db);openIDB().then(idb=>{let tx=idb.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(snapshot,IDB_KEY);tx.oncomplete=()=>{idbWritePending=false;};tx.onerror=tx.onabort=()=>{idbWritePending=false;alert('No se pudo guardar la base en IndexedDB. Exporta un respaldo y evita cerrar la pestaña.');};}).catch(e=>{console.error(e);alert('No se pudo guardar la base en IndexedDB.');});}catch(e){console.error(e);alert('No se pudo preparar el guardado de la base.');}}
function load(){return blank()}
function save(){if(!idbReady){console.warn('IndexedDB aún no está inicializada; guardado pospuesto.');return false;}idbWritePending=true;persistToIDB();return true}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s=''){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase()}
function firstName(s=''){return s.trim().split(/\s+/)[0]||''}
function makePassword(name,identifier){return norm(firstName(name)).slice(0,3)+String(identifier||'').trim().replace(/\s+/g,'')}
function ensurePasswords(data){(data.students||[]).forEach(x=>{if(!x.password)x.password=makePassword(x.name,x.id)});(data.teachers||[]).forEach(x=>{if(!x.password)x.password=makePassword(x.name,x.code)})}
function setLogin(r){loginRole=r;['student','teacher','admin'].forEach(x=>{document.getElementById(x+'Tab').className=x===r?'selected':''});drawLogin()}
function drawLogin(){let f=document.getElementById('loginFields'),h=document.getElementById('loginHelp');if(loginRole==='student'){f.innerHTML=`<div class="field"><label>Correo institucional</label><input id="lemail" type="email" placeholder="nombre@uniminuto.edu.co"></div><div class="field"><label>Clave de acceso</label><input id="lpass" type="password" placeholder="Clave de acceso"></div><button style="width:100%" onclick="studentLogin()">Ingresar</button>`;h.textContent='Clave inicial: primeras 3 letras del primer nombre (en minúsculas) + número de identificación. Ejemplo: ana123456.'}else if(loginRole==='teacher'){f.innerHTML=`<div class="field"><label>Correo institucional</label><input id="lemail" type="email" placeholder="docente@uniminuto.edu.co"></div><div class="field"><label>Clave de acceso</label><input id="lpass" type="password" placeholder="Clave asignada por administración"></div><button style="width:100%" onclick="teacherLogin()">Ingresar</button>`;h.textContent='La clave inicial es: tres primeras letras del primer nombre + código docente. El correo debe estar registrado en la ficha del docente.'}else{f.innerHTML=`<div class="field"><label>Correo administrativo</label><input id="aemail" type="email" placeholder="Correo institucional"></div><div class="field"><label>Crear / ingresar clave administrativa</label><input id="apass" type="password" placeholder="Mínimo 10 caracteres"></div><button style="width:100%" onclick="adminLogin()">Continuar</button>`;h.textContent='Acceso de prueba configurado para la cuenta administradora institucional. Esta versión es local y no debe publicarse con credenciales incrustadas.'}}
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('logout').style.display='';document.getElementById('who').textContent=session.name;buildSide();render()}
function studentLogin(){let email=document.getElementById('lemail').value.trim().toLowerCase(),pass=document.getElementById('lpass').value;let s=db.students.find(x=>x.email.toLowerCase()===email&&x.status!=='Inactivo');if(!s||(s.password||makePassword(s.name,s.id))!==pass){alert('No fue posible validar el correo y la clave. Verifica los datos o consulta al administrador.');return}session={role:'student',...s};sessionStorage.setItem('uniminuto_session',JSON.stringify(session));page='home';showApp()}
function teacherLogin(){let email=document.getElementById('lemail').value.trim().toLowerCase(),pass=document.getElementById('lpass').value,t=db.teachers.find(x=>x.email.toLowerCase()===email&&x.status!=='Inactivo');if(!t||(t.password||makePassword(t.name,t.code))!==pass){alert('No fue posible validar el correo y la clave. La clave inicial corresponde a las tres primeras letras del primer nombre más el código docente.');return}session={role:'teacher',...t};sessionStorage.setItem('uniminuto_session',JSON.stringify(session));page='home';showApp()}
function adminLogin(){let email=document.getElementById('aemail').value.trim().toLowerCase(),pass=document.getElementById('apass').value;let principal=email==='jesus.gutierrez.c@uniminuto.edu'&&pass==='Asesorias2026*',legacy=email==='asesoriasacademicasvir@uniminuto.edu'&&pass==='AsesoriasVirt2026*',extra=(db.adminUsers||[]).find(a=>a.email.toLowerCase()===email&&a.password===pass);if(!principal&&!legacy&&!extra){alert('Credenciales administrativas incorrectas.');return}session={role:'admin',name:principal?'Administrativo principal':(extra?.name||'Administrativo'),email,isPrincipal:principal};sessionStorage.setItem('uniminuto_session',JSON.stringify(session));page='dashboard';showApp()}
function logout(){session=null;try{sessionStorage.removeItem('uniminuto_session')}catch(e){}document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('logout').style.display='none';document.getElementById('who').textContent='';drawLogin()}
function buildSide(){let items=session.role==='admin'?[['dashboard','Resumen'],...(session.isPrincipal?[['cleanup','Control y limpieza de datos']]:[]),['students','Estudiantes'],['teachers','Docentes'],['availability','Disponibilidad docente'],['subjects','Asignaturas'],['imports','Cargar bases'],['bookings','Reservas'],['office','Cuenta de Office'],['audit','Historial']]:session.role==='student'?[['home','Mis asignaturas'],['mybookings','Mis reservas'],['notifications','Notificaciones']]:[['home','Mi disponibilidad'],['teacherbookings','Mis sesiones'],['notifications','Notificaciones']];document.getElementById('side').innerHTML=items.map(([p,n])=>`<button class="nav ${page===p?'on':''}" onclick="go('${p}')">${n}</button>`).join('')}
function go(p){page=p;buildSide();render()}
function head(t,s,a=''){return `<div class="head"><div><h1>${t}</h1><div class="muted">${s}</div></div>${a}</div>`}
function stat(t,n){return `<div class="stat"><small>${t}</small><strong>${n}</strong></div>`}
function render(){let m=document.getElementById('main');if(session.role==='admin')renderAdmin(m);if(session.role==='student')renderStudent(m);if(session.role==='teacher')renderTeacher(m)}
function renderAdmin(m){if(page==='dashboard'){let active=db.activePeriod||'2026-Q4',rows=db.bookings.filter(b=>b.period===active),days=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],dayCounts=days.map((d,i)=>({d,n:rows.filter(b=>new Date(b.date+'T12:00:00').getDay()===(i+1)%7).length})),hours=Array.from({length:12},(_,i)=>7+i).map(h=>({h,n:rows.filter(b=>Number((b.start||'0:0').split(':')[0])===h).length}));m.innerHTML=head('Panel administrativo','Gestión de usuarios, periodos, disponibilidad y reservas')+`<div class="panel"><div class="toolbar"><label>Periodo activo de agendamiento</label><select id="dashboardPeriod" onchange="activatePeriod(this.value)">${periodOptions([...db.availability.map(a=>a.period),...db.students.flatMap(s=>(s.enrollments||[]).map(e=>e.period))])}</select></div></div><div class="notice"><b>Periodo activo:</b> ${esc(active)}. Solo se ofrecen asignaturas y disponibilidades de este periodo. Los periodos anteriores se conservan para consulta.</div><div class="panel"><h2>Configuración de calendario y semanas</h2><div class="period-config"><div class="field"><label>Periodo</label><select id="weekPeriod">${periodOptions([...Object.keys(db.periodConfig),active])}</select></div><div class="field"><label>Fecha de inicio de SEMANA 1 (lunes)</label><input id="weekStart" type="date" value="${esc((db.periodConfig[active]||{}).week1Start||'')}"></div><button onclick="saveWeekConfig()">Guardar configuración</button></div><p class="tiny">Las semanas se cuentan de lunes a domingo desde la fecha indicada. Esta fecha debe ser un lunes.</p></div><div class="grid">${stat('Estudiantes',db.students.length)}${stat('Docentes',db.teachers.length)}${stat('Bloques activos',db.availability.filter(a=>a.period===active).length)}${stat('Reservas del periodo',rows.length)}</div><div class="panel"><h2>Reservas por día · ${esc(active)}</h2>${barChart(dayCounts,'d','n')}</div><div class="panel"><h2>Reservas por hora · ${esc(active)}</h2>${barChart(hours,'h','n',true)}</div><div class="panel"><h2>Asesorías por asignatura</h2>${subjectChart(rows)}</div><div class="panel"><h2>Acciones principales</h2><div class="toolbar"><button onclick="go('imports')">Cargar / actualizar bases</button><button class="alt" onclick="go('students')">Estudiantes</button><button class="alt" onclick="go('teachers')">Docentes</button><button class="alt" onclick="go('bookings')">Consultar reservas</button></div><p class="muted">El administrativo consulta la asistencia y las cancelaciones, pero no registra la asistencia en nombre de estudiantes o docentes.</p></div><div class="panel"><h2>Control de cambios de disponibilidad docente</h2><div class="formgrid"><div class="field"><label>Desde</label><input id="teacherChangeFrom" type="date" value="${esc(db.teacherChangeWindow?.from||'')}"></div><div class="field"><label>Hasta</label><input id="teacherChangeTo" type="date" value="${esc(db.teacherChangeWindow?.to||'')}"></div><div class="field"><label>Cambios permitidos por docente</label><input id="teacherChangeLimit" type="number" min="0" value="${esc(db.teacherChangeWindow?.limit??2)}"></div></div><button onclick="saveTeacherChangeWindow()">Guardar periodo y límite</button><p class="tiny">El docente podrá hacer cambios dentro del rango definido, hasta el límite. El administrativo conserva edición ilimitada.</p></div>${session.isPrincipal?`<div class="panel"><h2>Crear usuarios administrativos (exclusivo)</h2><div class="formgrid"><div class="field"><label>Nombre</label><input id="newAdminName"></div><div class="field"><label>Correo</label><input id="newAdminEmail" type="email"></div><div class="field"><label>Contraseña</label><input id="newAdminPass" type="password"></div></div><button onclick="createAdminUser()">Crear administrativo</button><div class="tiny">${(db.adminUsers||[]).map(a=>esc(a.name+' · '+a.email)).join('<br>')||'No hay administradores adicionales.'}</div></div>`:''}<div class="panel"><h2>Últimas modificaciones</h2>${auditTable(db.audit.slice(0,6))}</div>`}
if(page==='students')m.innerHTML=head('Estudiantes','Consulta y modifica registros individuales. Las claves son editables.','<button onclick="editStudent()">+ Agregar estudiante</button>')+recordTable('students',['Nombre','Identificación','Correo','Programa','Estado','Contraseña'],['name','id','email','program','status','password']);
if(page==='teachers')m.innerHTML=head('Docentes','Gestiona datos, claves y disponibilidad de cada docente.','<button onclick="editTeacher()">+ Agregar docente</button>')+recordTable('teachers',['Nombre','Código docente','Correo','Estado','Contraseña'],['name','code','email','status','password']);

function subjectRows(period=db.activePeriod){let map=new Map();(db.students||[]).forEach(st=>(st.enrollments||[]).filter(e=>e.period===period&&e.code).forEach(e=>{let k=String(e.code).trim().toUpperCase();if(!map.has(k))map.set(k,{code:k,subject:e.subject||k,nrcs:new Set(),students:new Map(),teachers:new Map()});let x=map.get(k);if(e.nrc)x.nrcs.add(String(e.nrc));x.students.set(st.id,st)}));(db.availability||[]).filter(a=>a.period===period&&a.code).forEach(a=>{let k=String(a.code).trim().toUpperCase();if(!map.has(k))map.set(k,{code:k,subject:a.subject||k,nrcs:new Set(),students:new Map(),teachers:new Map()});let x=map.get(k);if(a.nrc)x.nrcs.add(String(a.nrc));let t=db.teachers.find(t=>String(t.code)===String(a.teacherCode));if(t&&t.status!=='Inactivo')x.teachers.set(t.code,t)});return [...map.values()].map(x=>({...x,nrcs:[...x.nrcs].sort(),students:[...x.students.values()],teachers:[...x.teachers.values()]})).sort((a,b)=>a.subject.localeCompare(b.subject,'es'))}
function renderSubjectCatalog(){let rows=subjectRows();return head('Asignaturas','Consulta la relación entre NRC, estudiantes habilitados y docentes que pueden atenderlos.')+`<div class="panel"><div class="toolbar"><label>Periodo</label><select id="subjectPeriod" onchange="renderSubjectPeriod(this.value)">${periodOptions([...db.students.flatMap(s=>(s.enrollments||[]).map(e=>e.period)),...db.availability.map(a=>a.period)])}</select><button class="alt" onclick="exportData('relacion_asignaturas',subjectExportRows(subjectRows(document.getElementById('subjectPeriod').value)))">Descargar Excel</button></div><div class="field"><label>Buscar asignatura</label><input id="subjectSearch" placeholder="Nombre o código" oninput="renderSubjectSearch()"></div><div id="subjectCatalog" class="subject-grid">${subjectCards(rows)}</div><div id="subjectDetail"></div></div>`}
function subjectCards(rows){return rows.length?rows.map(x=>`<button type="button" class="subject-card" style="display:block;width:100%;text-align:left;color:var(--ink);background:#fff" onclick='showSubjectDetail(${JSON.stringify(String(x.code))})'><b>${esc(x.subject)}</b><div class="tiny">Código: ${esc(x.code)}</div><div class="tiny">${x.nrcs.length} NRC · ${x.students.length} estudiantes · ${x.teachers.length} docentes</div><div class="tiny" style="color:var(--blue);margin-top:8px">Ver NRC, estudiantes y docentes →</div></button>`).join(''):'<div class="empty">No hay asignaturas relacionadas en este periodo.</div>'}
function renderSubjectSearch(){let p=document.getElementById('subjectPeriod')?.value||db.activePeriod,q=(document.getElementById('subjectSearch')?.value||'').toLowerCase();document.getElementById('subjectCatalog').innerHTML=subjectCards(subjectRows(p).filter(x=>x.subject.toLowerCase().includes(q)||x.code.toLowerCase().includes(q)));}

function showSubjectDetail(code){let p=document.getElementById('subjectPeriod')?.value||window.subjectPeriod||db.activePeriod;window.subjectPeriod=p;let x=subjectRows(p).find(a=>String(a.code).trim()===String(code).trim());if(!x){alert('No se encontró el detalle de esta asignatura en el periodo '+p+'.');return;}let rel=x.students.flatMap(st=>x.teachers.map(t=>({student:st.name,email:st.email,teacher:t.name,teacherCode:t.code,subject:x.subject})));document.getElementById('subjectDetail').innerHTML=`<hr><h2>${esc(x.subject)} · ${esc(x.code)}</h2><div class="formgrid"><div><h3>NRC asociados (${x.nrcs.length})</h3>${x.nrcs.length?`<ul>${x.nrcs.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:'<p class="muted">Sin NRC registrados</p>'}</div><div><h3>Docentes que atienden (${x.teachers.length})</h3>${x.teachers.length?`<ul>${x.teachers.map(t=>`<li>${esc(t.name)} · ${esc(t.code)}</li>`).join('')}</ul>`:'<p class="muted">Sin docentes con disponibilidad</p>'}</div></div><h3>Estudiantes que pueden recibir asesoría (${x.students.length})</h3><div class="tablewrap"><table><thead><tr><th>Estudiante</th><th>Correo</th><th>NRC inscrito</th></tr></thead><tbody>${x.students.map(st=>`<tr><td>${esc(st.name)}</td><td>${esc(st.email)}</td><td>${esc([...new Set((st.enrollments||[]).filter(e=>e.period===p&&String(e.code).trim().toUpperCase()===String(code).trim().toUpperCase()).map(e=>e.nrc))].join(', '))}</td></tr>`).join('')}</tbody></table></div><h3>Relaciones posibles estudiante–docente (${rel.length})</h3><div class="tablewrap"><table><thead><tr><th>Estudiante</th><th>Docente habilitado</th><th>Asignatura</th></tr></thead><tbody>${rel.map(r=>`<tr><td>${esc(r.student)}</td><td>${esc(r.teacher)}</td><td>${esc(r.subject)}</td></tr>`).join('')||'<tr><td colspan="3">No hay relaciones disponibles.</td></tr>'}</tbody></table></div>`}
function subjectExportRows(rows){return rows.flatMap(x=>x.students.flatMap(st=>x.teachers.map(t=>({period:document.getElementById('subjectPeriod')?.value||db.activePeriod,subject:x.subject,code:x.code,nrc_student:(st.enrollments||[]).filter(e=>e.code===x.code).map(e=>e.nrc).join(', '),student:st.name,student_email:st.email,teacher:t.name,teacher_code:t.code})) ))}
function periodOptions(extra=[]){let ps=[...new Set(['2026-Q1','2026-Q2','2026-Q3','2026-Q4','2027-Q1','2027-Q2','2027-Q3','2027-Q4',db.activePeriod,...extra].filter(Boolean))].sort();return ps.map(p=>`<option value="${esc(p)}" ${p===db.activePeriod?'selected':''}>${esc(p)}</option>`).join('')}
function barChart(rows,label,key,hour=false){let max=Math.max(1,...rows.map(x=>x[key]));return `<div style="display:grid;gap:8px">${rows.map(x=>`<div style="display:grid;grid-template-columns:95px 1fr 28px;gap:8px;align-items:center"><span class="tiny">${esc(x[label])}${hour?':00':''}</span><div style="height:13px;background:#edf2f7;border-radius:8px;overflow:hidden"><div style="height:100%;width:${x[key]/max*100}%;background:#0876bd"></div></div><b>${x[key]}</b></div>`).join('')}</div>`}
function subjectChart(rows){let m={};rows.forEach(b=>m[b.subject]=(m[b.subject]||0)+1);let a=Object.entries(m).map(([subject,n])=>({subject,n}));return a.length?barChart(a,'subject','n'):'<div class="empty">No hay reservas para este periodo.</div>'}
function sortAvailability(key){let dir=window.avSort?.key===key&&window.avSort.dir==='asc'?'desc':'asc';window.avSort={key,dir};renderAvailabilityFilter()}
function sortBookings(key){let rows=window.filteredBookings||db.bookings.filter(b=>b.period===db.activePeriod),dir=window.bookingSort?.key===key&&window.bookingSort.dir==='asc'?'desc':'asc';window.bookingSort={key,dir};rows.sort((a,b)=>String(a[key]??'').localeCompare(String(b[key]??''),'es',{numeric:true,sensitivity:'base'}));if(dir==='desc')rows.reverse();window.filteredBookings=rows;document.getElementById('bkTable').innerHTML=bookingTable(rows,true)}
function saveWeekConfig(){let p=document.getElementById('weekPeriod').value,d=document.getElementById('weekStart').value;if(!d){alert('Selecciona la fecha de inicio de la semana 1.');return}if(new Date(d+'T12:00:00').getDay()!==1){alert('La semana 1 debe iniciar un lunes.');return}db.periodConfig[p]={...(db.periodConfig[p]||{}),week1Start:d};save();alert('Configuración de semanas guardada para '+p);render()}

function filterBookings(){let p=document.getElementById('bkPeriod').value,w=document.getElementById('bkWeek')?.value||'',att=document.getElementById('bkAttendance').value,st=document.getElementById('bkStatus').value,t=document.getElementById('bkTeacher').value,pr=norm(document.getElementById('bkProgram').value),su=norm(document.getElementById('bkStudent').value),sb=norm(document.getElementById('bkSubject').value),day=document.getElementById('bkDay').value,month=document.getElementById('bkMonth').value,year=document.getElementById('bkYear').value;let rows=db.bookings.filter(b=>{let [yy,mm,dd]=(b.date||'').split('-');return (!p||b.period===p)&&(!w||Number(b.week||weekNumberForDate(b.date,b.period))===Number(w))&&(!att||b.studentAttendance===att||b.teacherAttendance===att)&&(!st||b.status===st)&&(!t||b.teacher===t)&&(!pr||norm(b.program).includes(pr))&&(!su||norm(b.student+' '+b.studentEmail).includes(su))&&(!sb||norm(b.subject).includes(sb))&&(!day||Number(dd)===Number(day))&&(!month||Number(mm)===Number(month))&&(!year||Number(yy)===Number(year))});window.filteredBookings=rows;document.getElementById('bkTable').innerHTML=bookingTable(rows,true)}
function renderStudent(m){if(page==='notifications')m.innerHTML=notificationPanel('student');if(page==='home'){let courses=(session.enrollments||[]).filter(c=>c.period===db.activePeriod);m.innerHTML=head('Hola, '+esc(session.name.split(' ')[0]),'Asignaturas habilitadas para el periodo activo '+esc(db.activePeriod))+`<div class="panel"><h2>Mis datos académicos</h2><p><b>Programa:</b> ${esc(session.program||'No registrado')}</p><p class="muted">Solo se muestran las asignaturas del periodo activo.</p></div><div class="panel"><h2>Asignaturas inscritas</h2>${studentCourseCards(courses)}</div>`}if(page==='mybookings')m.innerHTML=head('Mis reservas','Puedes registrar tu asistencia o cancelar y reprogramar tus reservas.')+`<div class="panel">${bookingTable(db.bookings.filter(b=>b.studentEmail===session.email),false,true)}</div>`}
function studentCourseCards(rows=session.enrollments||[]){if(!rows.length)return '<div class="empty">No se encontraron asignaturas inscritas para el periodo activo.</div>';return rows.map((c,i)=>{let teachers=availableTeachersForCourse(c);return `<div class="slot"><div><b>${esc(c.subject||c.code)}</b><div class="tiny">Código ${esc(c.code)} · NRC inscrito ${esc(c.nrc)} · ${teachers.length} docente(s) con disponibilidad en ${esc(db.activePeriod)}</div></div><button onclick="showSlots(${i})" ${teachers.length?'':'disabled'}>Ver horarios</button></div>`}).join('')}

function recordTable(type,labels,keys){let rows=db[type]||[];return `<div class="panel"><div class="toolbar"><input id="search" placeholder="Buscar..." oninput="filterTable()"><span class="muted">${rows.length} registros</span><button class="alt" onclick="exportRecords('${type}')">Descargar Excel</button><button class="red" onclick="deleteSelected('${type}')">Eliminar seleccionados</button></div><div class="tablewrap"><table><thead><tr><th class="checkcell"><input type="checkbox" title="Seleccionar todos" onchange="toggleAllRows(this)"></th>${labels.map((x,j)=>`<th><button class="sort-button" onclick="sortRecords('${type}','${keys[j]}')">${x} ↕</button></th>`).join('')}<th>Acción</th></tr></thead><tbody id="rows">${rows.map((r,i)=>`<tr><td><input type="checkbox" class="row-select" data-index="${i}"></td>${keys.map(k=>`<td>${k==='status'?`<span class="tag ${r[k]==='Activo'?'ok':''}">${esc(r[k]||'Activo')}</span>`:k==='password'?`<code>${esc(r[k]||'')}</code>`:esc(r[k]||'—')}</td>`).join('')}<td><button class="alt" onclick="showPersonSubjects('${type}',${i})">Ver asignaturas</button> <button class="alt" onclick="${type==='students'?`editStudent(${i})`:`editTeacher(${i})`}">Editar</button> <button class="red" onclick="deleteRecord('${type}',${i})">Eliminar</button></td></tr>`).join('')||`<tr><td class="empty" colspan="${labels.length+2}">Sin registros cargados.</td></tr>`}</tbody></table></div></div>`}
function toggleAllRows(el){document.querySelectorAll('.row-select').forEach(x=>x.checked=el.checked)}
function deleteSelected(type){let chosen=[...document.querySelectorAll('.row-select:checked')].map(x=>Number(x.dataset.index));if(!chosen.length){alert('Selecciona al menos un registro.');return}if(!confirm('¿Eliminar '+chosen.length+' registros seleccionados? Las reservas históricas se conservarán.'))return;chosen.sort((a,b)=>b-a).forEach(i=>{let x=db[type][i];if(x)log(type==='students'?'Estudiante':'Docente','Eliminado en bloque',type==='students'?x.id:x.code,'Registro','Eliminado');db[type].splice(i,1)});save();render()}
function showPersonSubjects(type,i){let person=db[type]?.[i];if(!person)return;let code=type==='students'?null:person.code,rows=type==='students'?(person.enrollments||[]).filter(e=>e.period===db.activePeriod):db.availability.filter(a=>a.teacherCode===code&&a.period===db.activePeriod);let unique=[...new Map(rows.map(x=>[x.code,x])).values()];openModal(type==='students'?'Asignaturas del estudiante':'Asignaturas habilitadas del docente',`<p><b>${esc(person.name)}</b><br><span class="tiny">${esc(type==='students'?person.email:person.code)}</span></p><p class="muted">Periodo consultado: ${esc(db.activePeriod)}</p>${unique.length?`<div class="tablewrap"><table><thead><tr><th>Código</th><th>Asignatura</th>${type==='students'?'<th>NRC</th>':'<th>NRC habilitados</th>'}</tr></thead><tbody>${unique.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.subject)}</td><td>${type==='students'?esc(x.nrc||'—'):esc([...new Set(rows.filter(a=>a.code===x.code).map(a=>a.nrc))].join(', '))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No tiene asignaturas asociadas en el periodo activo.</div>'}`)}
function deleteRecord(type,i){if(!confirm('¿Eliminar este registro? Las reservas históricas no se borrarán.'))return;let x=db[type][i];log(type==='students'?'Estudiante':'Docente','Eliminado',type==='students'?x.id:x.code,'Registro','Eliminado');db[type].splice(i,1);save();render()}
function sortRecords(type,key){let dir=window.sortDir?.[type+key]==='asc'?'desc':'asc';window.sortDir=window.sortDir||{};window.sortDir[type+key]=dir;db[type].sort((a,b)=>{let x=String(a[key]??''),y=String(b[key]??'');let nx=Number(x),ny=Number(y);let c=x&&y&&!Number.isNaN(nx)&&!Number.isNaN(ny)?nx-ny:x.localeCompare(y,'es',{numeric:true,sensitivity:'base'});return dir==='asc'?c:-c});render()}
function exportData(name,rows){if(!rows?.length){alert('No hay registros para exportar.');return}if(!window.XLSX){alert('No se pudo cargar el componente Excel. Verifica tu conexión.');return}let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Datos');XLSX.writeFile(wb,`${name}_${new Date().toISOString().slice(0,10)}.xlsx`)}

function editAvailability(code,nrc,subjectCode,period){if(session.role==='teacher'&&String(session.code)!==String(code))return;if(session.role==='teacher'&&!teacherCanChange(session.code,period)){alert(teacherChangeStatus(session.code,period));return}let a=db.availability.find(x=>x.teacherCode===code&&x.nrc===nrc&&x.code===subjectCode&&x.period===period);if(!a)return;let selected=Array.from({length:8},(_,i)=>i+1).filter(w=>weekAllowed(a.weeks,w));openModal('Editar disponibilidad',`<div class="formgrid">${[['teacher','Docente'],['day','Día'],['start','Hora inicio'],['end','Hora fin']].map(([k,l])=>`<div class="field"><label>${l}</label><input id="av_${k}" value="${esc(a[k]||'')}"></div>`).join('')}</div><div class="field"><label>Semanas de trabajo (selecciona cualquier combinación)</label><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${Array.from({length:8},(_,i)=>i+1).map(w=>`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" class="av_week" value="${w}" ${selected.includes(w)?'checked':''}>Semana ${w}</label>`).join('')}</div></div><div class="actions"><button class="alt" onclick="closeModal()">Cerrar</button><button onclick="saveAvailability('${code}','${nrc}','${subjectCode}','${period}')">Guardar</button></div>`)}

async function readCSV(){let f=document.getElementById('csvfile').files[0];if(!f){alert('Selecciona un archivo.');return}let type=document.getElementById('csvType').value,ext=(f.name.split('.').pop()||'').toLowerCase();try{let data;if(['xlsx','xls','xlsm','xlsb','ods'].includes(ext)){if(!window.XLSX){await loadSheetJS()}let buf=await f.arrayBuffer(),wb=XLSX.read(buf,{type:'array',cellDates:false});let first=wb.SheetNames[0];if(!first)throw new Error('El libro no contiene hojas.');data=XLSX.utils.sheet_to_json(wb.Sheets[first],{header:1,defval:'',raw:false}).filter(row=>row.some(v=>String(v).trim()!==''));}else if(['csv','tsv','txt'].includes(ext)){data=parseCSV(await f.text(),ext==='tsv'?'\t':null)}else{throw new Error('Formato no admitido. Usa XLSX, XLS, XLSM, XLSB, ODS, CSV, TSV o TXT.')}if(!data||data.length<2){alert('El archivo no tiene encabezados y registros suficientes.');return}pendingCSV={type,rows:data,fileName:f.name};let preview=data.slice(0,5).map(row=>'<tr>'+row.map(v=>`<td>${esc(v)}</td>`).join('')+'</tr>').join('');document.getElementById('csvpreview').innerHTML=`<h3>Previsualización · ${esc(f.name)} · ${data.length-1} filas</h3><div class="tablewrap"><table>${preview}</table></div><button style="margin-top:12px" onclick="importCSV()">Confirmar importación</button>`}catch(e){alert('No fue posible leer el archivo: '+e.message)}}
function loadSheetJS(){return new Promise((resolve,reject)=>{let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=resolve;sc.onerror=()=>reject(new Error('No se pudo cargar el lector de Excel. Verifica tu conexión a internet e inténtalo de nuevo.'));document.head.appendChild(sc)})}
function parseCSV(txt,forcedDelimiter=null){let lines=txt.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()),sample=lines[0]||'',d=forcedDelimiter||(sample.includes('\t')?'\t':sample.includes(';')?';':',');return lines.map(line=>{let out=[],v='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'&&line[i+1]==='"'&&q){v+='"';i++}else if(c==='"')q=!q;else if(c===d&&!q){out.push(v.trim());v=''}else v+=c}out.push(v.trim());return out})}
function importCSV(){
 let pending=pendingCSV;if(!pending){alert('Primero selecciona y previsualiza un archivo.');return}
 let type=pending.type,rows=pending.rows;
 let period=String(document.getElementById('importPeriod').value||'').normalize('NFKC').trim().toUpperCase().replace(/[‐‑‒–—]/g,'-').replace(/\s+/g,'');
 let mode=document.getElementById('importMode').value;
 if(!/^\d{4}-Q[1-6]$/.test(period)){alert('Usa una etiqueta de periodo como 2026-Q4.');return}
 if(!rows||rows.length<2){alert('El archivo no contiene filas de datos.');return}
 const headerKey=x=>String(x??'').replace(/^\uFEFF/,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
 const headers=rows[0].map(headerKey);
 const index={};headers.forEach((h,i)=>{if(h&&!Object.prototype.hasOwnProperty.call(index,h))index[h]=i});
 const aliases={
  name:['nombres','nombre','nombre_estudiante','nombres_estudiante','nombre_completo'],
  id:['id','codigo','código','identificacion','identificación','numero_de_identificacion','numero_identificacion','documento','codigo_estudiante','codigo_persona'],
  email:['correo_estudiante','email','correo','correo_institucional','email_estudiante'],
  program:['programa','nombre_programa','descripcion_programa','descripción_programa'],
  code:['codigo_materia','codigo_de_materia','codigo_asignatura','cod_materia'],
  subject:['asignatura_descripcion','descripcion_asignatura','asignatura','nombre_asignatura'],
  nrc:['nrc'],
  sourcePeriod:['periodo','period']
 };
 const get=(row,key)=>{for(const alias of aliases[key]||[]){let ix=index[headerKey(alias)];if(ix!==undefined&&row[ix]!==undefined&&String(row[ix]).trim()!=='')return String(row[ix]).trim()}return ''};
 let addedStudents=0,updatedStudents=0,addedEnrollments=0,updatedEnrollments=0,skipped=0;
 let studentMap=new Map((db.students||[]).map(st=>[String(st.id??'').trim(),st]));
 if(mode==='replace'){
   if(type==='students')db.students.forEach(st=>st.enrollments=(st.enrollments||[]).filter(e=>e.period!==period));
   else db.availability=db.availability.filter(a=>a.period!==period);
 }
 db.activePeriod=period;
 if(type==='students'){
   for(let r=1;r<rows.length;r++){
     const row=rows[r];if(!row||!row.some(v=>String(v??'').trim()!==''))continue;
     const name=get(row,'name'),id=get(row,'id'),email=get(row,'email').toLowerCase(),program=get(row,'program');
     const code=get(row,'code'),subject=get(row,'subject'),nrc=get(row,'nrc');
     if(!name||!id||!email||!code||!subject){skipped++;continue}
     let st=studentMap.get(id);
     if(!st){
       st={name,id,email,password:makePassword(name,id),program,status:'Activo',enrollments:[]};
       db.students.push(st);studentMap.set(id,st);addedStudents++;
     }else{
       if(mode!=='add'){st.name=name;st.email=email;st.program=program||st.program;st.status='Activo';updatedStudents++}
     }
     st.enrollments=st.enrollments||[];
     const enrollment={period,nrc,code,subject,teacher:'',teacherCode:'',sourcePeriod:get(row,'sourcePeriod')};
     const ei=st.enrollments.findIndex(e=>e.period===period&&String(e.nrc??'').trim()===nrc&&String(e.code??'').trim().toUpperCase()===code.toUpperCase());
     if(ei<0){st.enrollments.push(enrollment);addedEnrollments++}
     else if(mode!=='add'){st.enrollments[ei]=enrollment;updatedEnrollments++}
   }
   if(addedStudents===0&&addedEnrollments===0&&skipped>0){
     alert('No se importó ninguna fila. Se omitieron '+skipped+' filas. Encabezados detectados: '+headers.join(', ')+'. Revisa que el archivo tenga NOMBRES, ID, CORREO_ESTUDIANTE, CODIGO_MATERIA y ASIGNATURA_DESCRIPCION.');
     return;
   }
 }else{
   for(let r=1;r<rows.length;r++){
     const row=rows[r];if(!row||!row.some(v=>String(v??'').trim()!==''))continue;
     const o={};headers.forEach((h,i)=>o[h]=row[i]??'');
     const val=(...keys)=>{for(const k of keys){let v=o[headerKey(k)];if(v!==undefined&&String(v).trim()!=='')return String(v).trim()}return ''};
     const teacher=val('nombre_docente','nombres','nombre'),teacherCode=val('codigo_docente','cod_docente','codigo'),nrc=val('nrc'),code=val('codigo_materia','codigo_asignatura'),subject=val('asignatura_descripcion','asignatura','nombre_asignatura');
     if(!teacher||!teacherCode||!code){skipped++;continue}
     const item={teacher,teacherCode,nrc,code,subject,day:val('dia','dia_semana'),start:val('inicio','hora_inicio'),end:val('fin','hora_fin'),weeks:val('semana','semanas'),teamsLink:val('enlace_teams','teams','link_teams','url_teams'),period};
     const ix=db.availability.findIndex(x=>x.period===period&&x.teacherCode===teacherCode&&x.nrc===nrc&&x.code===code&&x.day===item.day&&x.start===item.start);
     if(ix<0){db.availability.push(item);addedEnrollments++}else if(mode!=='add'){db.availability[ix]=item;updatedEnrollments++}
     let ti=db.teachers.findIndex(t=>String(t.code).trim()===teacherCode);
     const em=val('correo_docente','email_docente','correo_electronico','correo_institucional','email','correo','mail').toLowerCase();
     if(ti<0){db.teachers.push({name:teacher,code:teacherCode,email:em,password:makePassword(teacher,teacherCode),status:'Activo'});addedStudents++}
     else if(mode!=='add'){db.teachers[ti].name=teacher;if(em)db.teachers[ti].email=em;updatedStudents++}
   }
 }
 const summary=`${addedStudents} personas nuevas · ${updatedStudents} personas actualizadas · ${addedEnrollments} asignaturas/bloques nuevos · ${updatedEnrollments} asignaturas/bloques actualizados · ${skipped} filas omitidas`;
 log('Importación',type,'Periodo '+period,'Modo',mode,summary);
 const saved=save();
 pendingCSV=null;
 document.getElementById('csvpreview').innerHTML=`<p class="tag ${saved?'ok':'full'}">Periodo ${esc(period)}: ${summary}. No se exige columna de estado. El histórico de otros periodos se conserva.</p>`;
}
function parseTime(s){let x=String(s).trim().toLowerCase().replace(/\./g,'').replace(/\s/g,'');let m=x.match(/^(\d{1,2}):(\d{2})(am|pm)?$/);if(!m)return null;let h=+m[1],min=+m[2];if(m[3]==='pm'&&h<12)h+=12;if(m[3]==='am'&&h===12)h=0;return h*60+min}
function formatTime(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function dayIndex(s){let d=norm(s);return ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'].findIndex(x=>d.startsWith(x))}
function availableTeachersForCourse(c){let seen=new Set();return db.availability.filter(a=>a.period===db.activePeriod&&String(a.code).trim()===String(c.code).trim()&&a.teacherCode&&db.teachers.some(t=>String(t.code)===String(a.teacherCode)&&t.status!=='Inactivo')).filter(a=>{let k=String(a.teacherCode);if(seen.has(k))return false;seen.add(k);return true})}
function getWeekStart(period){let cfg=db.periodConfig[period]||{};return cfg.week1Start||''}
function weekNumberForDate(dateStr,period){let base=getWeekStart(period);if(!base)return null;let d=new Date(dateStr+'T12:00:00'),b=new Date(base+'T12:00:00');let diff=Math.floor((d-b)/86400000);return diff<0?null:Math.floor(diff/7)+1}
function weekAllowed(expr,w){let s=String(expr||'').toLowerCase().replace(/semana/g,'').replace(/\s/g,'');if(!s)return true;return s.split(',').some(part=>{if(part.includes('-')){let [a,b]=part.split('-').map(Number);return Number.isFinite(a)&&Number.isFinite(b)&&w>=a&&w<=b}return Number(part)===w})}
function availabilityForCourse(c,dateStr,teacherCode=''){let day=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'][new Date(dateStr+'T12:00:00').getDay()],week=weekNumberForDate(dateStr,db.activePeriod);if(week===null)return [];return db.availability.filter(a=>a.period===db.activePeriod&&String(a.code).trim()===String(c.code).trim()&&(!teacherCode||String(a.teacherCode)===String(teacherCode))&&dayIndex(a.day)===dayIndex(day)&&weekAllowed(a.weeks,week)&&db.teachers.some(t=>String(t.code)===String(a.teacherCode)&&t.status!=='Inactivo'))}
function monthLabel(d){return d.toLocaleDateString('es-CO',{month:'long',year:'numeric'})}
function showSlots(i){let courses=(session.enrollments||[]).filter(c=>c.period===db.activePeriod),c=courses[i];if(!c){alert('La asignatura no pertenece al periodo activo.');return}let teachers=availableTeachersForCourse(c),teacherOpts=teachers.map(a=>{let t=db.teachers.find(x=>String(x.code)===String(a.teacherCode));return `<option value="${esc(a.teacherCode)}">${esc(t?.name||a.teacher)}</option>`}).filter((x,i,a)=>a.indexOf(x)===i).join('');let today=new Date();let first=new Date(today.getFullYear(),today.getMonth(),1);window.calendarState={courseIndex:i,course:c,month:first,selected:null,teacherCode:''};let body=`<div class="field"><label>Seleccionar personal (opcional)</label><select id="slotTeacher" onchange="calendarTeacherChanged(this.value)"><option value="">Cualquiera</option>${teacherOpts}</select></div><div class="calendar-layout"><div><div class="calendar-head"><button class="light" onclick="calendarMove(-1)">‹</button><b id="calendarMonth">${esc(monthLabel(first))}</b><button class="light" onclick="calendarMove(1)">›</button></div><div class="calendar-grid">${['L','M','X','J','V','S','D'].map(x=>`<b style="text-align:center;padding:7px">${x}</b>`).join('')}<div id="calendarDays" style="display:contents"></div></div></div><div><h3 style="margin:8px 0 16px">HORARIOS</h3><div id="calendarTimes" class="time-grid"><div class="empty">Selecciona una fecha disponible.</div></div></div></div><p class="tiny">Cada asesoría dura 60 minutos. La disponibilidad se valida por asignatura, docente, día y semana configurada.</p>`;openModal('Selecciona fecha y hora',body);renderCalendar()}

function renderCalendar(){let s=window.calendarState;if(!s)return;let month=s.month,year=month.getFullYear(),m=month.getMonth(),first=new Date(year,m,1),offset=(first.getDay()+6)%7,days=new Date(year,m+1,0).getDate(),html='';for(let i=0;i<offset;i++)html+='<span></span>';for(let day=1;day<=days;day++){let d=new Date(year,m,day),iso=[year,String(m+1).padStart(2,'0'),String(day).padStart(2,'0')].join('-'),avail=availabilityForCourse(s.course,iso,s.teacherCode),past=iso<new Date().toISOString().slice(0,10),has=avail.length>0;html+=`<button class="${past?'muted-day':''} ${s.selected===iso?'selected-day':''} ${has?'has-slots':''}" ${past||!has?'disabled':''} onclick="selectCalendarDate('${iso}')">${day}</button>`}document.getElementById('calendarMonth').textContent=monthLabel(month);document.getElementById('calendarDays').innerHTML=html;renderCalendarTimes()}
function selectCalendarDate(iso){window.calendarState.selected=iso;renderCalendar()}
function renderCalendarTimes(){let s=window.calendarState,box=document.getElementById('calendarTimes');if(!box)return;if(!s.selected){box.innerHTML='<div class="empty">Selecciona una fecha disponible.</div>';return}let av=availabilityForCourse(s.course,s.selected,s.teacherCode),slots=[];av.forEach(a=>{let st=parseTime(a.start),en=parseTime(a.end);if(st===null||en===null)return;for(let t=st;t+60<=en;t+=30){let start=formatTime(t),end=formatTime(t+60),taken=db.bookings.filter(b=>b.id!==window.reschedulingBookingId&&b.teacherCode===a.teacherCode&&b.date===s.selected&&b.start===start&&b.status==='Confirmada').length;if(taken<10&&!db.bookings.some(b=>b.id!==window.reschedulingBookingId&&b.studentEmail===session.email&&b.date===s.selected&&overlap(start,end,b.start,b.end)&&b.status==='Confirmada'))slots.push({date:s.selected,start,end,used:taken,teacher:a,course:s.course})}});window.currentSlots=slots;box.innerHTML=slots.length?slots.map((x,j)=>`<button class="time-option" onclick="book(${s.courseIndex},${j})">${x.start}</button>`).join(''):'<div class="empty">No hay horarios libres para esta fecha y docente. Prueba otra fecha o selecciona “Cualquiera”.</div>'}
function overlap(a,b,c,d){return a<d&&c<b}
function book(i,j){let courses=(session.enrollments||[]).filter(c=>c.period===db.activePeriod),c=courses[i],s=window.currentSlots[j],t=s?.teacher;if(!c||!s||!t){alert('No se pudo identificar la asignatura o el horario. Vuelve a seleccionar el espacio.');return}let exists=db.bookings.filter(b=>b.id!==window.reschedulingBookingId&&b.teacherCode===t.teacherCode&&b.date===s.date&&b.start===s.start&&b.status==='Confirmada');if(exists.length>=10){alert('Este espacio ya completó sus 10 cupos.');closeModal();return}let rescheduleId=window.reschedulingBookingId;if(rescheduleId){let old=db.bookings.find(x=>x.id===rescheduleId);if(old){old.status='Cancelada';old.cancelledBy='Estudiante';old.cancelReason='Cancelada por reprogramación solicitada por el estudiante';old.rescheduledBy='Estudiante';old.rescheduledAt=new Date().toISOString()}}window.reschedulingBookingId=null;let b={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),period:db.activePeriod,week:weekNumberForDate(s.date,db.activePeriod),student:session.name,studentEmail:session.email,studentId:session.id,program:session.program,subject:c.subject,code:c.code,nrc:c.nrc,teacher:t.teacher,teacherCode:t.teacherCode,teacherEmail:(db.teachers.find(x=>x.code===t.teacherCode)||{}).email||'',teamsLink:(db.teachers.find(x=>String(x.code)===String(t.teacherCode))||{}).teamsLink||'',date:s.date,start:s.start,end:s.end,status:'Confirmada',studentAttendance:'Pendiente',teacherAttendance:'Pendiente',created:new Date().toISOString()};db.bookings.push(b);addNotification(b.studentEmail,'student','Asesoría agendada',`Tu asesoría de ${b.subject} con ${b.teacher} quedó agendada para ${b.date} ${b.start}-${b.end}.`,b.id);addNotification(b.teacherEmail,'teacher','Nueva asesoría',`Se agendó una asesoría de ${b.subject} con ${b.student} para ${b.date} ${b.start}-${b.end}.`,b.id);if(rescheduleId){let old=db.bookings.find(x=>x.id===rescheduleId);if(old)old.rescheduledToBookingId=b.id}save();let mailBody=`Se registró una asesoría académica.\nAsignatura: ${b.subject}\nEstudiante: ${b.student}\nDocente: ${b.teacher}\nFecha: ${b.date}\nHora: ${b.start} a ${b.end}\nPeriodo: ${b.period}`;downloadOutlookEvent(b);closeModal();render();alert('Reserva registrada y archivo de calendario descargado (.ics). Abre el archivo en Outlook para agregar la cita y gestionar la invitación a los participantes.')}
function markAttendance(id,who,value='Asiste'){let b=db.bookings.find(x=>x.id===id);if(!b||b.status!=='Confirmada')return;if(who==='student'&&!(session.role==='student'&&b.studentEmail===session.email))return;if(who==='teacher'&&!(session.role==='teacher'&&b.teacherCode===session.code))return;let key=who+'Attendance';b[key]=value;b[who+'AttendanceAt']=new Date().toISOString();save();render();alert('Registro actualizado. El administrativo podrá consultarlo en el reporte.')}
function cancelBooking(id,who){let b=db.bookings.find(x=>x.id===id);if(!b||b.status!=='Confirmada')return;if(who==='student'&&!(session.role==='student'&&b.studentEmail===session.email))return;if(who==='teacher'&&!(session.role==='teacher'&&b.teacherCode===session.code))return;let reason=prompt('Motivo de cancelación (obligatorio):');if(reason===null||!reason.trim()){alert('Debe indicar un motivo para cancelar.');return}reason=reason.trim();b.status='Cancelada';b.cancelledBy=who==='student'?'Estudiante':'Docente';b.cancelReason=reason;b.cancelledAt=new Date().toISOString();addNotification(b.studentEmail,'student','Asesoría cancelada',`Se canceló ${b.subject} para ${b.date} ${b.start}-${b.end}. Motivo: ${reason}`,b.id);addNotification(b.teacherEmail,'teacher','Asesoría cancelada',`La asesoría ${b.subject} de ${b.date} ${b.start}-${b.end} fue cancelada por ${b.cancelledBy}. Motivo: ${reason}`,b.id);save();render();alert('La reserva quedó cancelada y se notificó dentro del agendador a los usuarios correspondientes.')}
function rescheduleBooking(id){let b=db.bookings.find(x=>x.id===id);if(!b||session.role!=='student'||b.studentEmail!==session.email||b.status!=='Confirmada')return;let courses=(session.enrollments||[]).filter(c=>c.period===db.activePeriod),ix=courses.findIndex(c=>c.nrc===b.nrc&&c.code===b.code);if(ix<0){alert('La asignatura de esta reserva no está en el periodo activo.');return}window.reschedulingBookingId=id;showSlots(ix);}
function saveOffice(){let v=document.getElementById('officeEmail').value.trim();if(!v.includes('@')){alert('Ingresa un correo válido.');return}db.officeEmail=v;save();alert('Correo remitente guardado. No se almacenó contraseña.')}
function downloadOutlookEvent(b){let toUTC=(date,time)=>{let d=new Date(date+'T'+time+':00-05:00');return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z')};let escIcs=v=>String(v??'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');let fold=line=>{let out='',chunk='',bytes=0;for(const ch of line){let n=new TextEncoder().encode(ch).length;if(bytes+n>73){out+=chunk+'\r\n ';chunk=ch;bytes=n}else{chunk+=ch;bytes+=n}}return out+chunk};let details=['Información de la asesoría académica','', 'ESTUDIANTE: '+(b.student||''),'ID ESTUDIANTE: '+(b.studentId||''),'CORREO ESTUDIANTE: '+(b.studentEmail||''),'PROGRAMA: '+(b.program||''),'ASIGNATURA: '+(b.subject||''),'CÓDIGO ASIGNATURA: '+(b.code||''),'NRC: '+(b.nrc||''),'PROFESOR: '+(b.teacher||''),'CORREO PROFESOR: '+(b.teacherEmail||''),'FECHA: '+b.date,'HORARIO: '+b.start+' a '+b.end,'PERIODO: '+(b.period||''),'','MODALIDAD: Reunión virtual',b.teamsLink?'ENLACE TEAMS: '+b.teamsLink:'No hay enlace Teams cargado para este código de asignatura.'].join('\n');let ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//UNIMINUTO//Consejeria Academica//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT','UID:'+b.id+'@consejeria.uniminuto.edu','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'').replace('Z','Z'),'DTSTART:'+toUTC(b.date,b.start),'DTEND:'+toUTC(b.date,b.end),'SUMMARY:'+escIcs('Asesorías Académicas: '+b.subject),'DESCRIPTION:'+escIcs(details),'LOCATION:'+escIcs(b.teamsLink||'Reunión virtual'),'STATUS:CONFIRMED','TRANSP:OPAQUE','END:VEVENT','END:VCALENDAR'].map(fold).join('\r\n');let blob=new Blob([ics],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Asesoria_'+b.date+'_'+b.start.replace(':','')+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function outlookCompose(to,subject,body){let url='https://outlook.office.com/mail/deeplink/compose?'+new URLSearchParams({to,subject,body}).toString();window.open(url,'_blank')}
function notifyBooking(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;let subject='Confirmación de espacio de Consejería Académica';let body=`Hola ${b.student},\\n\\nTu espacio de Consejería Académica ha sido registrado.\\nAsignatura: ${b.subject}\\nDocente: ${b.teacher}\\nFecha: ${b.date}\\nHorario: ${b.start} a ${b.end} (Bogotá).\\n\\nSaludos,\\nConsejería Académica UNIMINUTO`;outlookCompose(b.studentEmail,subject,body);downloadOutlookEvent(b)}

function saveTeacherChangeWindow(){let from=document.getElementById('teacherChangeFrom').value,to=document.getElementById('teacherChangeTo').value,limit=Number(document.getElementById('teacherChangeLimit').value);if(from&&to&&from>to){alert('La fecha inicial debe ser anterior a la fecha final.');return}if(!Number.isInteger(limit)||limit<0){alert('El límite debe ser un entero igual o mayor que cero.');return}db.teacherChangeWindow={from,to,limit};save();log('Configuración','Disponibilidad docente','Periodo de cambios', '',from+' a '+to+' · límite '+limit);alert('Configuración guardada.');render()}
function teacherChangeCount(code,period){return (db.teacherChangeLog||[]).filter(x=>x.teacherCode===String(code)&&x.period===period).length}
function teacherCanChange(code,period){let w=db.teacherChangeWindow||{},today=new Date().toISOString().slice(0,10);return !!w.from&&!!w.to&&today>=w.from&&today<=w.to&&teacherChangeCount(code,period)<Number(w.limit??2)}
function teacherChangeStatus(code,period){let w=db.teacherChangeWindow||{},n=teacherChangeCount(code,period),lim=Number(w.limit??2),today=new Date().toISOString().slice(0,10);if(!w.from||!w.to)return 'El administrativo aún no ha habilitado el periodo de cambios.';if(today<w.from||today>w.to)return 'Cambios habilitados del '+w.from+' al '+w.to+'.';if(n>=lim)return 'Has utilizado '+n+' de '+lim+' cambios. Solicita apoyo administrativo.';return 'Cambios disponibles: '+(lim-n)+' de '+lim+' hasta '+w.to+'.'}
